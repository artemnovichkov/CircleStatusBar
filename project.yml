# Source of truth for CircleStatusBar.xcodeproj. Regenerate with: xcodegen
name: CircleStatusBar
options:
  bundleIdPrefix: com.artemnovichkov
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
settingGroups:
  # Ad-hoc signing runs on "My Mac" and simulators without a team.
  # For a physical iPhone, switch to automatic signing and pick your team.
  signing:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  CircleStatusBar:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    settings:
      groups: [signing]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artemnovichkov.CircleStatusBar
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Circle Status Bar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
schemes:
  CircleStatusBar:
    build:
      targets:
        CircleStatusBar: all
